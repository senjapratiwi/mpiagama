<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>MPI Darsana & Sad Darsana</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--card:#fff;--ink:#2b1a4a;--soft:#f3ecff}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2a1b4d;--ink:#fff3dc;--soft:#3b2766}}
:root[data-theme="dark"]{--card:#2a1b4d;--ink:#fff3dc;--soft:#3b2766}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#ff6bcb,#7c4dff 45%,#00c2ff);background-attachment:fixed;min-height:100vh;font-size:17px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#ffd93dee;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#2b1a4a;box-shadow:0 4px 0 #ff9f1c}
header b{font-size:18px}.xp{margin-left:auto;background:#2b1a4a;color:#ffd93d;border-radius:20px;padding:2px 12px}
#bar{height:8px;background:#fff8;flex-basis:100%;border-radius:9px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3d81,#7c4dff);transition:.5s}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}
nav button{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid #fff;background:#ffffff40;color:#fff;font:800 15px 'Baloo 2';cursor:pointer}
nav button.on{background:#ffd93d;color:#2b1a4a;transform:scale(1.15)}nav button.done{background:#2ecc71}
main{max-width:860px;margin:0 auto;padding:6px 14px 40px}
.card{background:var(--card);border-radius:26px;padding:20px;border:4px solid #2b1a4a;box-shadow:0 8px 0 #2b1a4a;animation:pop .45s}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}}
h1,h2{margin:0 0 8px;line-height:1.1}h1{font-size:32px;color:#ff3d81}h2{font-size:26px;color:#7c4dff}
.tag{display:inline-block;background:#ffd93d;color:#2b1a4a;border-radius:20px;padding:2px 12px;margin:3px 3px 3px 0;font-weight:700}
.mascot{font-size:70px;display:inline-block;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-12px) rotate(6deg)}}
.say{background:var(--soft);border-radius:18px;padding:10px 14px;margin:8px 0;border-left:8px solid #ff3d81}
.btn{font:800 17px 'Baloo 2';border:3px solid #2b1a4a;border-radius:16px;padding:8px 18px;background:#ff3d81;color:#fff;cursor:pointer;box-shadow:0 5px 0 #2b1a4a;margin:4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2b1a4a}.btn.g{background:#2ecc71}.btn.y{background:#ffd93d;color:#2b1a4a}
.pager{display:flex;justify-content:space-between;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mem{background:var(--soft);border-radius:18px;padding:10px;text-align:center;border:3px dashed #7c4dff}
.flip{height:190px;perspective:800px;cursor:pointer}.flip div{position:relative;width:100%;height:100%;transition:.6s;transform-style:preserve-3d}
.flip.f div{transform:rotateY(180deg)}.flip section{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:4px solid #2b1a4a;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:15px}
.flip .b{transform:rotateY(180deg);background:#2b1a4a!important}.flip .a span{font-size:46px}
/* infografis */
.info{text-align:center}.root{display:inline-block;background:linear-gradient(135deg,#ffd93d,#ff9f1c);color:#2b1a4a;border:4px solid #2b1a4a;border-radius:24px;padding:10px 22px;font-weight:800;box-shadow:0 6px 0 #2b1a4a;animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 6px 0 #2b1a4a,0 0 28px #ffd93d}}
.stem{width:6px;height:28px;background:#2b1a4a;margin:0 auto;border-radius:3px}
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:26px 10px;border-top:6px solid #2b1a4a;padding-top:0;position:relative;margin-top:0}
.node{position:relative;padding-top:28px}.node:before{content:"";position:absolute;top:0;left:50%;width:6px;height:28px;background:#2b1a4a;margin-left:-3px}
.nc{border:4px solid #2b1a4a;border-radius:22px;padding:10px 6px;color:#fff;box-shadow:0 6px 0 #2b1a4a;cursor:pointer;transition:.2s}.nc:hover{transform:translateY(-6px) rotate(-2deg)}
.nc .ic{font-size:40px;background:#fff;border-radius:50%;width:66px;height:66px;line-height:66px;margin:-34px auto 4px;border:4px solid #2b1a4a}
.nc small{display:block;background:#0003;border-radius:12px;margin-top:6px;padding:2px 4px}
.nast{margin-top:20px;background:var(--soft);border:3px dashed #ff3d81;border-radius:20px;padding:10px}
.mid{background:var(--soft);padding:12px;border-radius:16px;margin-top:12px;min-height:60px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 14px;border-radius:14px;border:3px solid #2b1a4a;background:var(--card);color:var(--ink);font:600 16px 'Baloo 2';cursor:pointer}
.opt:hover{background:#ffd93d;color:#2b1a4a}.opt.ok{background:#2ecc71!important;color:#fff!important;animation:jump .4s}.opt.no{background:#ff5252!important;color:#fff!important;animation:shake .4s}
@keyframes jump{50%{transform:scale(1.05)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pill{padding:8px 12px;margin:4px;border-radius:14px;border:3px solid #2b1a4a;cursor:pointer;font:700 15px 'Baloo 2';background:var(--card);color:var(--ink)}
.pill.sel{background:#ffd93d;color:#2b1a4a}.pill.gone{opacity:.25;pointer-events:none;background:#2ecc71;color:#fff}
.big{font-size:80px;font-weight:800;color:#ff3d81}
textarea{width:100%;border-radius:14px;border:3px solid #7c4dff;padding:10px;font:16px 'Baloo 2';background:var(--card);color:var(--ink)}
ul{padding-left:20px}li{margin:5px 0}
.sp,.cf{position:fixed;pointer-events:none;z-index:99}.sp{animation:fade .8s forwards}.cf{animation:fall 1.6s forwards}
@keyframes fade{to{opacity:0;transform:translateY(-30px) scale(.3) rotate(90deg)}}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg);opacity:.7}}
</style></head><body>
<header><span style="font-size:26px">🕉️</span><b>MPI Darsana</b><span class="xp" id="xp">⭐ 0 XP · Lv 1</span><div id="bar"><i></i></div></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s);
const S=[["Nyaya","🔍","#ff3d81","Rsi Gotama","Logika & Pramana","Penalaran logis, epistemologi, cara memperoleh pengetahuan benar (Pramana) untuk membedakan benar dan salah."],
["Vaisesika","⚛️","#ff9f1c","Rsi Kanada","Kosmologi & Atom","Hakikat alam semesta dan materi (Padartha) yang tersusun dari atom (Paramanu), serta hukum sebab-akibat fisik."],
["Samkhya","☯️","#7c4dff","Rsi Kapila","Dualisme","Filsafat tertua: alam terbentuk dari dua unsur abadi, Purusa (kesadaran) dan Prakriti (materi alam)."],
["Yoga","🧘","#00b894","Rsi Patanjali","Pengendalian Diri","Latihan spiritual & meditasi lewat delapan tahap (Astangga Yoga) untuk menyatukan jiwa dengan Paramatman."],
["Mimamsa","🔥","#e84393","Rsi Jaimini","Ritual & Dharma","Kajian pelaksanaan Yadnya dan kewajiban moral (Dharma) berdasarkan Karma Kanda dalam Weda."],
["Vedanta","🌌","#0984e3","Rsi Badarayana (Vyasa)","Puncak Weda","Berbasis Upanisad: hubungan Atman, Brahman, dan Maya (ilusi duniawi)."]];
const Q=[
["Aliran Sad Darsana yang memusatkan ajarannya pada meditasi dan pengendalian gelombang pikiran (citta vrtti nirodha) adalah...",["Nyaya","Vaisesika","Samkhya","Yoga","Mimamsa"],3,"Benar! Yoga (Rsi Patanjali) berfokus pada pengendalian diri dan meditasi."],
["Mengapa ajaran Nyaya sangat relevan bagi pelajar abad 21?",["Mengajarkan cara membangun candi megah","Melatih berpikir logis, kritis, dan menyaring informasi hoaks","Fokus pada tata cara upacara yadnya","Membahas struktur atom alam semesta","Mengajarkan teknik pernapasan fisik"],1,"Tepat sekali! Nyaya menekankan epistemologi dan logika untuk mencari kebenaran informasi."],
["Tokoh Rsi pendiri Samkhya, filsafat dualisme tertua yang membedakan Purusa dan Prakriti, adalah...",["Rsi Gotama","Rsi Kanada","Rsi Kapila","Rsi Jaimini","Rsi Patanjali"],2,"Benar! Rsi Kapila adalah pendiri aliran Samkhya."],
["Kelompok filsafat Hindu yang tidak mengakui otoritas Weda (Carvaka, Jaina, Buddha) digolongkan ke dalam...",["Astika","Sad Darsana","Nastika","Vedanta","Orthodox"],2,"Tepat! Nastika adalah kelompok yang tidak bersumber pada otoritas Weda."],
["Relevansi Vedanta (puncak pemikiran Weda) di abad 21 terutama dalam membangun...",["Sistem persenjataan modern","Sikap toleransi global dan kesadaran bahwa esensi semua makhluk satu (Tat Tvam Asi)","Teknologi kecerdasan buatan","Sistem perdagangan bebas","Cara bercocok tanam hidroponik"],1,"Benar sekali! Vedanta mengajarkan persatuan universal yang relevan untuk kerukunan dan toleransi."],
["Aliran Sad Darsana pendiri Rsi Kanada yang mengkaji hakikat materi alam semesta dan atom (Padartha) adalah...",["Nyaya","Vaisesika","Mimamsa","Samkhya","Yoga"],1,"Tepat! Rsi Kanada adalah pendiri Vaisesika yang membahas kosmologi dan zat materi."],
["Purva Mimamsa yang didirikan Rsi Jaimini menitikberatkan pembahasan pada...",["Pengendalian pikiran lewat latihan yoga","Pelaksanaan upacara suci (Yadnya) dan kewajiban dharma berdasarkan Karma Kanda","Pembebasan jiwa lewat meditasi tinggi","Analisis struktur atom","Pengenalan ilusi duniawi (Maya)"],1,"Benar! Mimamsa berfokus pada pelaksanaan yadnya dan tata cara ritual."],
["Yang termasuk delapan tahapan Astangga Yoga adalah...",["Pratyaksha, Anumana, dan Sabda","Purusa dan Prakriti","Yama, Niyama, Asana, Pranayama, Pratyahara, Dharana, Dhyana, Samadhi","Tattwa, Susila, dan Upacara","Karma, Samsara, dan Moksha"],2,"Tepat sekali! Astangga Yoga terdiri dari 8 tahapan, dari Yama hingga Samadhi."],
["Bagaimana relevansi Vaisesika dalam menghadapi masalah lingkungan di abad 21?",["Mengajak mengeksploitasi alam secara bebas","Menumbuhkan kesadaran ekologis (Eco-Hinduism) karena unsur alam teratur dan ciptaan suci","Mengabaikan alam fisik karena dianggap ilusi","Membangun pabrik industri di setiap wilayah","Memakai teknologi digital untuk merusak hutan"],1,"Benar! Vaisesika mengajarkan penghargaan pada unsur alam semesta, sejalan dengan pelestarian lingkungan."],
["Secara etimologis, Astika dalam penggolongan filsafat India merujuk pada kelompok yang...",["Menolak hukum karma","Berakar dan mengakui otoritas kitab suci Weda","Berasal dari luar India kuno","Hanya mempelajari astronomi","Mengutamakan materi di atas spiritualitas"],1,"Tepat! Astika mengakui otoritas Weda, sedangkan Nastika tidak."]];
const T=["Pembuka","Tim","Tujuan","Petunjuk","Materi","Sad Darsana","Infografik","Relevansi","Aktivitas","Kuis","Skor","Kesimpulan","Refleksi","Pustaka"];
let cur=0,xp=0,seen=new Set(),qi=0,score=0,ans=false,matched=0,sel={};
const L=()=>1+Math.floor(xp/50);
function addXP(n){xp+=n;$('#xp').textContent=`⭐ ${xp} XP · Lv ${L()}`}
function boom(){for(let i=0;i<34;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🎉','🪷','✨','🕉️','⭐','🌸'][i%6];e.style.cssText=`left:${Math.random()*100}vw;top:-30px;font-size:${18+Math.random()*18}px;--x:${(Math.random()-.5)*200}px;animation-delay:${Math.random()*.4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}}
addEventListener('pointermove',e=>{if(Math.random()<.35){const s=document.createElement('span');s.className='sp';s.textContent='✨';s.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;font-size:${12+Math.random()*12}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),800)}});
const say=(t,m='🧑‍🎓')=>`<div class="say"><span style="font-size:28px">${m}</span> ${t}</div>`;
const P=[
()=>`<div class="card" style="text-align:center"><div class="mascot">🧘</div><span class="mascot" style="font-size:50px;animation-delay:.5s">🪷</span><h1>Mengenal Lebih Dekat Sistem Filsafat Hindu</h1><h2>Darsana & Sad Darsana</h2><p><span class="tag">SMA / SMK Sederajat</span><span class="tag">Fase F / Genap</span><span class="tag">Pendidikan Agama Hindu & Budi Pekerti</span></p><p><b>Tema:</b> Membuat Media Pembelajaran Interaktif Darsana</p><p><span class="tag" style="background:#ff3d81;color:#fff">Berkesadaran</span><span class="tag" style="background:#7c4dff;color:#fff">Bermakna</span><span class="tag" style="background:#00b894;color:#fff">Menyenangkan</span></p>${say('Modul ini membantu kamu memahami hakikat filsafat Hindu, pembagian Sad Darsana, dan relevansinya menghadapi tantangan abad 21. Yuk mulai petualangan! 🚀')}<button class="btn y" onclick="boom();go(1)">✨ Mulai Belajar!</button></div>`,
()=>`<div class="card"><h2>👥 Identitas Kelompok</h2><p style="font-size:22px"><b>Kelompok ASTA CHATRA</b> 🌟</p><div class="grid">${["Dewa Ayu Yunita Cinta Astari (05)","I Gusti Ayu Indira Maheswari (08)","Wayan Asha Rajendra Pratama (15)","Made Anggita Cahyani (20)","Made Arista Putri Dewanthi (21)","Ni Kadek Senja Pratiwi (25)","Ni Made Dina Arianti (30)","Ni Putu Geisya Artha Padmaswari (35)"].map((n,i)=>`<div class="mem" onclick="boom()"><div style="font-size:34px">${['😄','😎','🤓','🥳','😊','🤩','😇','🧐'][i]}</div>${n}</div>`).join('')}</div><p>Ketuk kartu anggota untuk efek ajaib! 🎊</p></div>`,
()=>`<div class="card"><h2>🎯 Tujuan Pembelajaran</h2><p>Setelah belajar dengan modul ini, kamu mampu:</p><ul>${["Menjelaskan pengertian Darsana menurut etimologi dan terminologi Hindu dengan benar.","Menguraikan pokok-pokok ajaran filsafat Darsana (Astika dan Nastika).","Mengidentifikasi enam aliran Sad Darsana beserta tokoh pendiri dan pokok ajarannya.","Menganalisis konsep Sad Darsana yang relevan dengan kehidupan abad 21.","Menerapkan nilai kebijaksanaan Darsana dalam kehidupan sehari-hari."].map(t=>`<li>${t}</li>`).join('')}</ul></div>`,
()=>`<div class="card"><h2>🧭 Petunjuk Penggunaan</h2><div class="grid">${[["🙏","Berdoa","Awali dengan doa pembuka pelajaran agama Hindu."],["📖","Baca Materi","Pelajari berurutan: Pengertian, Pokok Ajaran, Sad Darsana."],["📊","Amati Infografis","Perhatikan bagan untuk memudahkan pemahaman."],["🎮","Aktivitas & Kuis","Ikuti game, aktivitas, dan kuis."],["💭","Refleksi","Jawab pertanyaan refleksi di akhir modul."]].map(a=>`<div class="mem"><div style="font-size:40px">${a[0]}</div><b>${a[1]}</b><br>${a[2]}</div>`).join('')}</div></div>`,
()=>`<div class="card"><h2>📚 Materi Darsana</h2><h3>A. Pengertian Darsana</h3><p>Kata <b>Darsana</b> berasal dari bahasa Sanskerta, akar kata <b>drś</b> yang berarti "melihat" atau "memandang". Dalam filsafat Hindu, Darsana adalah pandangan tentang kebenaran atau pandangan filsafat.</p><p>Darsana lahir dari perenungan spiritual mendalam, pengamatan empiris, dan penafsiran Kitab Suci Weda oleh para Rsi suci. Tujuannya bukan sekadar menambah pengetahuan, tetapi jalan spiritual untuk melenyapkan <b>Avidya</b> (ketidaktahuan) dan mencapai <b>Moksha</b> (kebebasan sejati).</p><h3>B. Penggolongan Filsafat Darsana</h3><div class="grid"><div class="mem" style="border-color:#2ecc71"><div style="font-size:40px">📜✅</div><b>Astika (Orthodox)</b><br>Mengakui dan bersumber pada otoritas Weda. Melahirkan enam sistem utama: Sad Darsana.</div><div class="mem" style="border-color:#ff5252"><div style="font-size:40px">📜❌</div><b>Nastika (Heterodox)</b><br>Tidak mengakui otoritas Weda (Carvaka, Jaina, Buddha).</div></div></div>`,
()=>`<div class="card"><h2>🃏 Sad Darsana: 6 Sistem Filsafat</h2><p><b>Sad</b> = enam, <b>Darsana</b> = pandangan. Ketuk kartu untuk membaliknya!</p><div class="grid">${S.map((s,i)=>`<div class="flip" onclick="this.classList.toggle('f');addXP(3)"><div><section class="a" style="background:${s[2]}"><span>${s[1]}</span><b style="font-size:22px">${s[0]}</b>${s[4]}</section><section class="b"><b>${s[3]}</b>${s[5]}</section></div></div>`).join('')}</div></div>`,
()=>`<div class="card info"><h2>📊 Infografik Sad Darsana</h2><p>Ketuk tiap aliran untuk detailnya!</p><div class="root">🕉️ SISTEM FILSAFAT HINDU (DARSANA)</div><div class="stem"></div><div class="root" style="background:linear-gradient(135deg,#55efc4,#00b894)">✅ ASTIKA · Mengakui Weda<br><small>= SAD DARSANA</small></div><div class="stem"></div><div class="tree">${S.map((s,i)=>`<div class="node"><div class="nc" style="background:${s[2]}" onclick="document.getElementById('mid').innerHTML='<b>${s[1]} ${s[0]}</b> · ${s[3]}<br>${s[5]}';boom()"><div class="ic">${s[1]}</div><b>${i+1}. ${s[0].toUpperCase()}</b><small>${s[4]}</small><small>👤 ${s[3].replace('Rsi ','')}</small></div></div>`).join('')}</div><div class="mid" id="mid">👆 Pilih salah satu aliran</div><div class="nast">❌ <b>NASTIKA</b> (tidak mengakui Weda): 🌀 Carvaka · 🕊️ Jaina · ☸️ Buddha</div></div>`,
()=>`<div class="card"><h2>🌏 Relevansi Darsana di Abad 21</h2><div class="grid">${[["📱","Era Digital & Nyaya","Berpikir kritis: verifikasi data sebelum menyebarkan informasi di tengah hoaks.","#ff3d81"],["🌳","Krisis Lingkungan & Vaisesika","Menghargai setiap unsur ciptaan Tuhan, mendukung pelestarian lingkungan (Eco-Hinduism).","#ff9f1c"],["🧠","Kesehatan Mental & Samkhya/Yoga","Tidak terikat berlebihan pada materi, serta Yoga untuk ketenangan jiwa dan wellness.","#00b894"],["💼","Etika Profesi & Mimamsa","Bekerja sebagai Yadnya: pengabdian tulus dan tanggung jawab moral profesional.","#e84393"],["🤝","Toleransi Global & Vedanta","Tat Tvam Asi ('Aku adalah Engkau') menumbuhkan cinta kasih universal dan perdamaian.","#0984e3"]].map(r=>`<div class="mem" style="border-color:${r[3]}"><div style="font-size:40px">${r[0]}</div><b>${r[1]}</b><br>${r[2]}</div>`).join('')}</div></div>`,
()=>`<div class="card"><h2>🎮 Aktivitas Interaktif</h2><h3>Game 1: Jodohkan Rsi dengan Alirannya!</h3><p>Pilih satu Rsi, lalu aliran yang cocok.</p><div id="g1"></div><h3>Game 2: Diskusi Kelompok (Studi Kasus Abad 21)</h3><label><input type="checkbox" onchange="this.checked&&(addXP(5),boom())"> Bentuk kelompok kecil di kelas</label><br><label><input type="checkbox" onchange="this.checked&&(addXP(5),boom())"> Analisis: "Bagaimana menghadapi kecanduan media sosial dan kecemasan masa kini dengan filsafat Yoga dan Samkhya?"</label><br><label><input type="checkbox" onchange="this.checked&&(addXP(5),boom())"> Presentasikan hasil analisis di depan kelas</label></div>`,
()=>`<div class="card" id="qz"></div>`,
()=>{const v=score*10,t=v>=80?['🏆','Sangat Baik','Luar biasa! Kamu Sang Darsanika sejati!']:v>=60?['🥈','Baik','Bagus! Sedikit lagi sempurna.']:['📚','Perlu Remedial','Jangan menyerah, ulangi materi dan kuisnya ya!'];return`<div class="card" style="text-align:center"><h2>🏅 Skor / Hasil Belajar</h2><div class="mascot">${t[0]}</div><div class="big">${v}</div><p><b>${score} benar dari 10 soal</b> (×10 poin) · <span class="tag">${t[1]}</span></p>${say(t[2],'🧘')}<p style="text-align:left">Kriteria: 80-100 = Sangat Baik · 60-79 = Baik · &lt;60 = Perlu Remedial</p><button class="btn y" onclick="qi=0;score=0;ans=false;go(9)">🔁 Ulangi Kuis</button></div>`},
()=>`<div class="card"><h2>🌟 Kesimpulan</h2><ul><li>Darsana adalah pandangan filsafat Hindu untuk mencari kebenaran hakiki dan mencapai kebebasan spiritual (Moksha).</li><li>Sad Darsana terdiri dari enam aliran (Nyaya, Vaisesika, Samkhya, Yoga, Mimamsa, Vedanta) yang mengakui otoritas Weda (Astika).</li><li>Nilai Darsana kontekstual di abad 21: berpikir kritis, menjaga kesehatan mental, melestarikan lingkungan, dan merawat toleransi global.</li></ul></div>`,
()=>`<div class="card"><h2>💭 Refleksi Pembelajaran</h2>${["Bagian materi Darsana mana yang paling menarik dan mudah saya pahami hari ini? Mengapa?","Tantangan abad 21 apa yang paling sering saya rasakan, dan aliran Sad Darsana mana yang ingin saya terapkan?","Perubahan sikap apa yang akan saya mulai terapkan setelah mempelajari modul ini?"].map((q,i)=>`<p><b>${i+1}. ${q}</b></p><textarea rows="3" placeholder="Tulis jawabanmu..."></textarea>`).join('')}<button class="btn g" onclick="boom();addXP(10)">💾 Selesai Refleksi</button></div>`,
()=>`<div class="card"><h2>📖 Daftar Sumber / Pustaka</h2><ul><li>Kementerian Pendidikan, Kebudayaan, Riset, dan Teknologi RI. Buku Panduan Guru & Buku Siswa Pendidikan Agama Hindu dan Budi Pekerti.</li><li>Punia, I Nyoman. <i>Filsafat Agama Hindu (Darsana)</i>. Surabaya: Paramita.</li><li>Titib, Made. <i>Teologi Hindu (Brahma Tattwa)</i>. Denpasar: Kayu Mas.</li></ul><p style="text-align:center;font-size:22px">🙏 Om Santih Santih Santih Om 🪷</p></div>`];
function nav(){$('#nav').innerHTML=T.map((t,i)=>`<button title="${t}" class="${i==cur?'on':seen.has(i)?'done':''}" onclick="go(${i})">${i+1}</button>`).join('');$('#bar i').style.width=(seen.size/14*100)+'%'}
function go(i){cur=i;if(!seen.has(i)){seen.add(i);addXP(5)}$('#m').innerHTML=P[i]()+`<div class="pager"><button class="btn" onclick="go(${Math.max(0,i-1)})" ${i?'':'disabled style="opacity:.3"'}>⬅️ Kembali</button><b style="color:#fff;align-self:center">${i+1}. ${T[i]}</b><button class="btn g" onclick="go(${Math.min(13,i+1)})" ${i<13?'':'disabled style="opacity:.3"'}>Lanjut ➡️</button></div>`;nav();scrollTo(0,0);if(i==8)g1();if(i==9)quiz()}
function g1(){matched=0;sel={};const r=S.map((s,i)=>[s,i]).sort(()=>Math.random()-.5),a=S.map((s,i)=>[s,i]).sort(()=>Math.random()-.5);$('#g1').innerHTML=`<div>${r.map(x=>`<button class="pill" id="r${x[1]}" onclick="pick('r',${x[1]})">👤 ${x[0][3]}</button>`).join('')}</div><div>${a.map(x=>`<button class="pill" id="a${x[1]}" onclick="pick('a',${x[1]})">${x[0][1]} ${x[0][0]}</button>`).join('')}</div><div class="mid" id="gm">Pilih satu Rsi dan satu aliran!</div>`}
function pick(k,i){sel[k]=i;document.querySelectorAll('.pill').forEach(p=>{if(p.id[0]==k)p.classList.remove('sel')});$('#'+k+i).classList.add('sel');if(sel.r!=null&&sel.a!=null){if(sel.r==sel.a){['r','a'].forEach(z=>{$('#'+z+sel[z]).className='pill gone'});matched++;addXP(10);boom();$('#gm').textContent=`✅ Benar! ${S[sel.r][3]} = ${S[sel.r][0]} (${matched}/6)`;if(matched==6)$('#gm').textContent='🎉 Hebat! Semua pasangan benar!'}else{document.querySelectorAll('.sel').forEach(p=>p.classList.add('no'));$('#gm').textContent='❌ Belum cocok, coba lagi!';setTimeout(()=>document.querySelectorAll('.pill').forEach(p=>p.classList.remove('sel','no')),500)}sel={}}}
function quiz(){const c=$('#qz');if(qi>=10){go(10);return}const q=Q[qi];ans=false;c.innerHTML=`<h2>❓ Kuis ${qi+1}/10 <span class="tag">Skor ${score*10}</span></h2><p><b>${q[0]}</b></p>${q[1].map((o,i)=>`<button class="opt" onclick="choose(${i})">${'ABCDE'[i]}. ${o}</button>`).join('')}<div id="fb"></div>`}
function choose(i){if(ans)return;ans=true;const q=Q[qi],o=document.querySelectorAll('.opt');o[q[2]].classList.add('ok');if(i==q[2]){score++;addXP(10);boom();$('#fb').innerHTML=say('🎉 '+q[3],'🧘')}else{o[i].classList.add('no');$('#fb').innerHTML=say(`Belum tepat. Jawaban benar: ${'ABCDE'[q[2]]}. ${q[3]}`,'🤔')}$('#fb').innerHTML+=`<button class="btn y" onclick="qi++;quiz()">${qi<9?'Soal Berikutnya ➡️':'Lihat Skor 🏅'}</button>`}
go(0);
</script></body></html>
